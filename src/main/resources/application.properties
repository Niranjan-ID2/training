# PostgreSQL DataSource Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/your_database_name
spring.datasource.username=your_postgres_username
spring.datasource.password=your_postgres_password
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate JPA properties
spring.jpa.hibernate.ddl-auto=update # Specifies how schema is created or updated. 'update' is good for development.
spring.jpa.show-sql=true # To see SQL queries in logs, useful for debugging
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true # Required for JSONB or large objects with newer PostgreSQL versions
